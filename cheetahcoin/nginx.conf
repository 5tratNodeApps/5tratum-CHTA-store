events {}
http {
    server {
        listen 8080;

        # Serve the loading screen by default
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Route to check if the mining portal is alive
        location /pool-check {
            proxy_pass http://chta_pool:8080/;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
}
