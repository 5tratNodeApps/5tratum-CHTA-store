<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetahcoin App Loading</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding-top: 20%; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #ff9900; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Cheetahcoin Solo Miner is Initializing...</h2>
    <p>The backend node is currently syncing with the blockchain network. This window will refresh automatically.</p>
    <script>
        // Simple script to check if the true mining pool port is alive yet
        setInterval(function() {
            fetch('/pool-check').then(res => {
                if(res.status === 200) { window.location.reload(); }
            }).catch(err => console.log("Still syncing..."));
        }, 5000);
    </script>
</body>
</html>
