id: cheetahcoin
name: "Cheetahcoin Solo Miner"
version: "1.1.0"
description: "Advanced Cheetahcoin mining portal with status tracking and integrated settings controls."
developer: "5stratNodeApps"
website: "https://github.com"
submitter: "5stratNodeApps"
icon: "https://githubusercontent.com"
gallery: []
port: 8080
# Hooks the window directly into 5tratum's reverse web proxy layer
proxy:
  path: "/apps/cheetahcoin"
# Registers input settings directly into the native 5tratum UI settings pane
settings:
  - id: developer_fee
    name: "Developer Pool Fee (%)"
    type: "number"
    default: 1.0
  - id: target_address
    name: "Payout Wallet Address"
    type: "text"
    default: "CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL"
