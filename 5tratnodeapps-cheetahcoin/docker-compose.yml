version: '3.7'

services:
  # Container 1: Web Administration Console
  chta_admin_interface:
    image: node:18-alpine
    container_name: chta_admin_interface
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - chta_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        wget -qO /index.html "https://raw.githubusercontent.com/5tratNodeApps/5tratum-CHTA-store/main/5tratnodeapps-cheetahcoin/index.html"
        cat << 'EOF' > /server.js
        const http = require("http"), fs = require("fs"), { execSync } = require("child_process");
        const cfgFile = "/data/settings.json";
        const loadCfg = () => { try { return JSON.parse(fs.readFileSync(cfgFile, "utf8")); } catch (e) { return { prune: 0, diff: 0.001 }; } };
        const get = (opts, body) => new Promise(r => {
          const req = http.request(opts, res => { let d=""; res.on("data",c=>d+=c); res.on("end",()=>{ try{r(JSON.parse(d))}catch(e){r(null)} }); });
          req.on("error", ()=>r(null)); if(body) req.write(body); req.end();
        });
        http.createServer(async (req, res) => {
          if (req.url === "/status") {
            const rpc = m => get({hostname:"chta_node",port:4743,method:"POST",auth:"5tratum_user:5tratum_secure_pass"}, JSON.stringify({jsonrpc:"1.0",id:1,method:m,params:[]}));
            const [i, n, s] = await Promise.all([rpc("getblockchaininfo"), rpc("getnetworkinfo"), get({hostname:"chta_pool",port:80,path:"/api/stats"})]);
            const blocks = i?.result?.blocks || 0, headers = i?.result?.headers || 0, peers = n?.result?.connections || 0;
            const difficulty = i?.result?.difficulty || 0, bestblockhash = i?.result?.bestblockhash || "";
            let diskMB = 0; try { diskMB = parseInt(execSync("du -sm /data 2>/dev/null").toString().split("\t")[0], 10) || 0; } catch (e) {}
            const p = s?.pools?.cheetahcoin || {}, w = p.workers || {};
            const workers = Object.keys(w).map(k => ({ name: k.split(".").pop() || k, hashrate: w[k].hashrateString || "0 H/s" }));
            res.writeHead(200, {"Content-Type":"application/json"});
            return res.end(JSON.stringify({ blocks, headers, pct: headers > 0 ? Math.min(100, blocks/headers*100) : 0, peers, difficulty, bestblockhash, diskMB, settings: loadCfg(), pool: { hashrate: p.hashrateString || "0 H/s", blocks: (p.blocks?.pending||0)+(p.blocks?.confirmed||0), confirmed: p.blocks?.confirmed||0, workers } }));
          }
          if (req.url === "/settings" && req.method === "POST") {
            let b = ""; req.on("data", c => b += c);
            return req.on("end", () => {
              try {
                const cur = loadCfg(), next = JSON.parse(b);
                const updated = { prune: Math.max(0, parseInt(next.prune ?? cur.prune, 10) || 0), diff: Math.max(0.0005, parseFloat(next.diff ?? cur.diff) || 0.001) };
                fs.writeFileSync(cfgFile, JSON.stringify(updated));
                res.writeHead(200, {"Content-Type":"application/json"});
                res.end(JSON.stringify({ ok: true, settings: updated }));
              } catch (e) { res.writeHead(400); res.end('{"ok":false}'); }
            });
          }
          res.writeHead(200, {"Content-Type":"text/html"});
          fs.createReadStream("/index.html").pipe(res);
        }).listen(8080, "0.0.0.0");
        EOF
        node /server.js

  # Container 2: Redis Database
  redis:
    image: redis:alpine
    container_name: chta_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Container 3: Cheetahcoin v2.5.0 Core Daemon
  chta_node:
    image: ubuntu:22.04
    container_name: chta_node
    restart: unless-stopped
    volumes:
      - chta_data:/root/.cheetahcoin
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /root/.cheetahcoin/bin
        if [ ! -f /root/.cheetahcoin/bin/cheetahcoind ]; then
          apt-get -o Acquire::http::Timeout=15 update && apt-get install -y wget tar ca-certificates
          H=github.com
          P=/ShorelineCrypto/cheetahcoin/releases/download/v2.5.0/cheetahcoin_2.5.0_x86_64_linux-gnu.tgz
          wget -O /tmp/chta.tgz https://$$H$$P
          tar -xzf /tmp/chta.tgz -C /root/.cheetahcoin/bin --strip-components=1
          rm /tmp/chta.tgz
        fi
        PRUNE=$$(grep -o '"prune":[0-9]*' /root/.cheetahcoin/settings.json 2>/dev/null | cut -d: -f2)
        PRUNE_ARG=""
        if [ -n "$$PRUNE" ] && [ "$$PRUNE" -gt 0 ]; then PRUNE_ARG="-prune=$$PRUNE"; fi
        /root/.cheetahcoin/bin/cheetahcoind -datadir=/root/.cheetahcoin -server=1 -rpcuser=5tratum_user -rpcpassword=5tratum_secure_pass -rpcallowip=0.0.0.0/0 -rpcport=4743 -listen=1 -printtoconsole -addnode=66.24.77.71:8537 -addnode=139.99.209.227:8537 $$PRUNE_ARG -maxconnections=64
# Container 4: NOMP Mining Portal & Stratum Proxy
  chta_pool:
    image: shorelinecrypto/nomp-neng:latest
    container_name: chta_pool
    restart: unless-stopped
    ports:
      - "3032:3032"
    depends_on:
      - chta_node
      - redis
    volumes:
      - chta_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /opt/node-open-mining-portal
        rm -rf config.json pool_configs
        mkdir -p pool_configs
        cp config_example.json config.json
        sed -i 's/127.0.0.1/redis/g' config.json
        sed -i 's/172.23.0.2/0.0.0.0/g' config.json
        sed -i 's/cryppit.com/0.0.0.0/g' config.json
        sed -i 's/"cliHost": "redis"/"cliHost": "0.0.0.0"/g' config.json
        if [ ! -s /data/pool_address.txt ]; then
          until curl -s --user 5tratum_user:5tratum_secure_pass --data-binary '{"jsonrpc":"1.0","id":"1","method":"getnewaddress","params":["pool"]}' -H 'content-type: text/plain;' http://chta_node:4743/ | grep -o '"result":"[^"]*"' | cut -d'"' -f4 > /data/pool_address.txt && [ -s /data/pool_address.txt ]; do
            echo "Waiting for chta_node RPC to create permanent pool address..."
            sleep 5
          done
        fi
        POOL_ADDR=$$(cat /data/pool_address.txt)
        START_DIFF=$$(grep -o '"diff":[0-9.]*' /data/settings.json 2>/dev/null | cut -d: -f2)
        if [ -z "$$START_DIFF" ]; then START_DIFF="0.001"; fi
        cat << EOF > pool_configs/cheetahcoin.json
        {
          "enabled": true,
          "coin": "cheetahcoin.json",
          "address": "$$POOL_ADDR",
          "rewardRecipients": {
            "CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL": 1.0
          },
          "paymentProcessing": {
            "enabled": true,
            "paymentInterval": 600,
            "minimumPayment": 1,
            "daemon": {
              "host": "chta_node",
              "port": 4743,
              "user": "5tratum_user",
              "password": "5tratum_secure_pass"
            }
          },
          "ports": {
            "3032": {
              "diff": $$START_DIFF,
              "varDiff": {
                "minDiff": 0.0005,
                "maxDiff": 100,
                "targetTime": 15,
                "retargetTime": 60,
                "variancePercent": 30
              }
            }
          },
          "daemons": [
            {
              "host": "chta_node",
              "port": 4743,
              "user": "5tratum_user",
              "password": "5tratum_secure_pass"
            }
          ]
        }
        EOF
        until curl -s --user 5tratum_user:5tratum_secure_pass --data-binary '{"jsonrpc":"1.0","id":"1","method":"getblockchaininfo","params":[]}' -H 'content-type: text/plain;' http://chta_node:4743/ | grep -q "verificationprogress"; do
          echo "Waiting for chta_node RPC on port 4743..."
          sleep 5
        done
        while true; do
          node init.js
          echo "Waiting for chta_node to finish syncing..."
          sleep 15
        done

volumes:
  chta_data:
