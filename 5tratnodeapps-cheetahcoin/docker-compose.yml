version: '3.7'

services:
  # Container 1: Web Administration Console (Placed first so it immediately claims port 8080)
  chta_admin_interface:
    image: node:18-alpine
    container_name: chta_admin_interface
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat << 'EOF' > /server.js
        const http = require("http");
        const https = require("https");
        const fallback = "<body style='background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:8%'><div style='max-width:600px;margin:auto;background:#1e1e1e;padding:25px;border-radius:10px;border:1px solid #ff9900'><h2 style='color:#ff9900'>Cheetahcoin Solo Miner Console</h2><p><strong>Status:</strong> Node &amp; Pool Active</p><p><strong>Stratum Port:</strong> 3032</p></div></body>";

        function rpc(method) {
          return new Promise(resolve => {
            const data = JSON.stringify({ jsonrpc: "1.0", id: "1", method, params: [] });
            const req = http.request({
              hostname: "chta_node",
              port: 4743,
              method: "POST",
              auth: "5tratum_user:5tratum_secure_pass",
              headers: { "Content-Type": "application/json", "Content-Length": data.length }
            }, res => {
              let body = "";
              res.on("data", c => body += c);
              res.on("end", () => {
                try { resolve(JSON.parse(body).result); } catch (e) { resolve(null); }
              });
            });
            req.on("error", () => resolve(null));
            req.write(data);
            req.end();
          });
        }

        http.createServer(async (req, res) => {
          if (req.url === "/status") {
            const info = await rpc("getblockchaininfo");
            const net = await rpc("getnetworkinfo");
            const blocks = info ? (info.blocks || 0) : 0;
            const headers = info ? (info.headers || 0) : 0;
            const pct = headers > 0 ? Math.min(100, (blocks / headers) * 100) : 0;
            const peers = net ? (net.connections || 0) : 0;
            res.writeHead(200, { "Content-Type": "application/json" });
            return res.end(JSON.stringify({ blocks, headers, pct, peers }));
          }

          https.get({
            hostname: "://githubusercontent.com",
            path: "/5tratNodeApps/5tratum-CHTA-store/main/5tratnodeapps-cheetahcoin/index.html",
            headers: { "User-Agent": "5tratumOS" }
          }, r => {
            if (r.statusCode !== 200) {
              res.writeHead(200, { "Content-Type": "text/html" });
              return res.end(fallback);
            }
            res.writeHead(200, { "Content-Type": "text/html" });
            r.pipe(res);
          }).on("error", () => {
            res.writeHead(200, { "Content-Type": "text/html" });
            res.end(fallback);
          });
        }).listen(8080, "0.0.0.0");
        EOF
        node /server.js

  # Container 2: Redis Database
  redis:
    image: redis:alpine
    container_name: chta_redis
    restart: unless-stopped

  # Container 3: Cheetahcoin v2.5.0 Core Daemon (Uses $$H and $$P so Docker Compose keeps the variables)
  chta_node:
    image: ubuntu:22.04
    container_name: chta_node
    restart: unless-stopped
    volumes:
      - chta_data:/root/.cheetahcoin
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y wget tar ca-certificates
        mkdir -p /opt/chta /root/.cheetahcoin
        if [ ! -f /opt/chta/cheetahcoind ]; then
          H=github.com
          P=/ShorelineCrypto/cheetahcoin/releases/download/v2.5.0/cheetahcoin_2.5.0_x86_64_linux-gnu.tgz
          wget -O /tmp/chta.tgz https://$$H$$P
          tar -xzf /tmp/chta.tgz -C /opt/chta --strip-components=1
          rm /tmp/chta.tgz
        fi
        /opt/chta/cheetahcoind -datadir=/root/.cheetahcoin -server=1 -rpcuser=5tratum_user -rpcpassword=5tratum_secure_pass -rpcallowip=0.0.0.0/0 -rpcport=4743 -listen=1 -printtoconsole

    # Container 4: Self-Contained Web Console (Live Sync Bar + User Wallet Setup)
  chta_admin_interface:
    image: node:18-alpine
    container_name: chta_admin_interface
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat << 'EOF' > /index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Cheetahcoin Solo Miner Console</title>
          <style>
            body { background: #111; color: #fff; font-family: sans-serif; padding: 5%; text-align: center; margin: 0; }
            .card { max-width: 600px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #ff9900; }
            .subcard { max-width: 600px; margin: 20px auto; background: #1a1a1a; padding: 22px; border-radius: 10px; font-size: 14px; color: #ccc; text-align: left; }
            h2 { color: #ff9900; margin-top: 0; text-align: center; }
            .progress-wrap { background: #333; border-radius: 6px; height: 22px; overflow: hidden; margin: 15px 0 8px; }
            .progress-bar { background: #ff9900; height: 100%; width: 0%; transition: width 0.5s ease; }
            .pct-text { font-size: 20px; font-weight: bold; color: #ff9900; }
            .block-info { font-size: 13px; color: #aaa; margin: 6px 0 14px; }
            .notice-wait { background: #2d1f0a; border: 1px solid #ff9900; color: #ffcc80; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.4; }
            .notice-ready { background: #0f2918; border: 1px solid #2ecc71; color: #a3e4d7; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.4; }
            label { display: block; margin: 14px 0 6px; font-weight: bold; color: #fff; font-size: 13px; }
            input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: #ff9900; font-family: monospace; font-size: 14px; }
            input:focus { outline: none; border-color: #ff9900; }
            .output-row { display: flex; align-items: center; justify-content: space-between; background: #262626; padding: 10px 12px; border-radius: 6px; margin-top: 6px; gap: 10px; }
            code { color: #ff9900; font-size: 13px; word-break: break-all; }
            button { background: #ff9900; color: #111; border: none; padding: 7px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap; }
            button:hover { background: #e68a00; }
            .note { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }
          </style>
        </head>
        <body>
          <div class="card">
            <h2>Cheetahcoin Solo Miner Console</h2>
            <div id="syncStatus"><strong>Node Status:</strong> Checking blockchain sync...</div>
            <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
            <div class="pct-text" id="pctText">0.00%</div>
            <div class="block-info" id="blockInfo">Blocks: -- / -- &nbsp;|&nbsp; Peers: --</div>
            <div class="notice-wait" id="connectNotice">
              <strong>Notice:</strong> Please wait until the blockchain sync reaches <strong>100%</strong> before connecting your mining devices. Stratum port 3032 opens automatically once synced.
            </div>
            
          </div>
          <div class="subcard">
            <h3 style="color:#ff9900;margin-top:0">Connected Devices &amp; Stats</h3>
            <p><strong>Total Hashrate:</strong> <span id="totalHash" style="color:#ff9900">0 H/s</span> &nbsp;|&nbsp; <strong>Active Workers:</strong> <span id="workerCount" style="color:#ff9900">0</span> &nbsp;|&nbsp; <strong>Blocks Found:</strong> <span id="blocksFound" style="color:#ff9900">0</span></p>
            <div id="workerList" style="font-size:13px;color:#aaa">No active workers connected yet.</div>
          </div>

          <div class="subcard">
            <label for="wallet">Your CHTA Payout Wallet Address:</label>
            <input type="text" id="wallet" placeholder="Paste your Cheetahcoin (CHTA) address here..." oninput="updateConfig()">

            <label for="worker">Worker Name (Optional):</label>
            <input type="text" id="worker" value="worker1" oninput="updateConfig()">

            <label>Stratum Pool URL (Auto-Detected):</label>
            <div class="output-row">
              <code id="stratumUrl">stratum+tcp://192.168.1.100:3032</code>
              <button onclick="copyText('stratumUrl', this)">Copy</button>
            </div>

            <label>Miner Worker Username:</label>
            <div class="output-row">
              <code id="workerOutput">YOUR_CHTA_ADDRESS.worker1</code>
              <button onclick="copyText('workerOutput', this)">Copy</button>
            </div>

            <label>Miner Password:</label>
            <div class="output-row">
              <code id="passOutput">x</code>
              <button onclick="copyText('passOutput', this)">Copy</button>
            </div>

            <p class="note">Your wallet address is saved locally in your browser. A 1% pool developer fee supports ongoing app maintenance.</p>
          </div>

          <script>
            const host = window.location.hostname;
            const isLocal = host && host !== "127.0.0.1" && host !== "localhost";
            document.getElementById("stratumUrl").textContent = "stratum+tcp://" + (isLocal ? host : "YOUR_NODE_IP") + ":3032";

            const savedWallet = localStorage.getItem("chta_user_wallet");
            const savedWorker = localStorage.getItem("chta_user_worker");
            if (savedWallet) document.getElementById("wallet").value = savedWallet;
            if (savedWorker) document.getElementById("worker").value = savedWorker;
            updateConfig();

            function updateConfig() {
              const w = document.getElementById("wallet").value.trim();
              const n = document.getElementById("worker").value.trim() || "worker1";
              localStorage.setItem("chta_user_wallet", w);
              localStorage.setItem("chta_user_worker", n);
              document.getElementById("workerOutput").textContent = (w || "YOUR_CHTA_ADDRESS") + "." + n;
            }

            function copyText(id, btn) {
              navigator.clipboard.writeText(document.getElementById(id).textContent);
              const orig = btn.textContent;
              btn.textContent = "Copied!";
              setTimeout(() => btn.textContent = orig, 1500);
            }

            async function fetchSync() {
              try {
                const res = await fetch("/status");
                if (!res.ok) return;
                const data = await res.json();
                const pct = parseFloat(data.pct) || 0;
                document.getElementById("progressBar").style.width = pct + "%";
                document.getElementById("pctText").textContent = pct.toFixed(2) + "%";
                document.getElementById("blockInfo").textContent = "Blocks: " + data.blocks.toLocaleString() + " / " + data.headers.toLocaleString() + " | Peers: " + data.peers;
                const notice = document.getElementById("connectNotice");
                if (pct >= 99.9 && data.headers > 0) {
                  document.getElementById("syncStatus").innerHTML = "<strong>Node Status:</strong> Fully Synced &amp; Ready";
                  notice.className = "notice-ready";
                  notice.innerHTML = "<strong>Ready to Mine:</strong> Blockchain sync is at 100%. You can now connect your mining devices to port <strong>3032</strong>.";
                } else {
                  document.getElementById("syncStatus").innerHTML = "<strong>Node Status:</strong> Synchronizing Blockchain...";
                  notice.className = "notice-wait";
                }
                                if (data.pool) {
                  document.getElementById("totalHash").textContent = data.pool.hashrate;
                  document.getElementById("workerCount").textContent = data.pool.workers.length;
                  document.getElementById("blocksFound").textContent = data.pool.blocks;
                  document.getElementById("workerList").innerHTML = data.pool.workers.length ? data.pool.workers.map(w => "• <strong>" + w.name.split('.').pop() + "</strong>: <span style='color:#ff9900'>" + w.hashrate + "</span>").join("<br>") : "No active workers connected yet.";
                }

              } catch (e) {}
            }

            fetchSync();
            setInterval(fetchSync, 5000);
          </script>
        </body>
        </html>
        EOF

        cat << 'EOF' > /server.js
        const http = require("http");
        const fs = require("fs");

        function rpc(method) {
          return new Promise(resolve => {
            const data = JSON.stringify({ jsonrpc: "1.0", id: "1", method, params: [] });
            const req = http.request({
              hostname: "chta_node",
              port: 4743,
              method: "POST",
              auth: "5tratum_user:5tratum_secure_pass",
              headers: { "Content-Type": "application/json", "Content-Length": data.length }
            }, res => {
              let body = "";
              res.on("data", c => body += c);
              res.on("end", () => {
                try { resolve(JSON.parse(body).result); } catch (e) { resolve(null); }
              });
            });
            req.on("error", () => resolve(null));
            req.write(data);
            req.end();
          });
        }

        http.createServer(async (req, res) => {
          if (req.url === "/status") {
            const info = await rpc("getblockchaininfo");
            const net = await rpc("getnetworkinfo");
            const pool = await new Promise(r => http.get("http://chta_pool/api/stats", res => {
              let b = ""; res.on("data", c => b += c);
              res.on("end", () => { try { const p = JSON.parse(b).pools.cheetahcoin; r({ hashrate: p.hashrateString || "0 H/s", blocks: (p.blocks.pending || 0) + (p.blocks.confirmed || 0), workers: Object.entries(p.workers || {}).map(([name, i]) => ({ name, hashrate: i.hashrateString || "0 H/s" })) }); } catch (e) { r(null); } });
            }).on("error", () => r(null)));
            const blocks = info ? (info.blocks || 0) : 0;
            const headers = info ? (info.headers || 0) : 0;
            const pct = headers > 0 ? Math.min(100, (blocks / headers) * 100) : 0;
            const peers = net ? (net.connections || 0) : 0;
            res.writeHead(200, { "Content-Type": "application/json" });
            return res.end(JSON.stringify({ blocks, headers, pct, peers, pool }));
          }
          res.writeHead(200, { "Content-Type": "text/html" });
          fs.createReadStream("/index.html").pipe(res);
        }).listen(8080, "0.0.0.0");
        EOF
        node /server.js
  # Container 5: NOMP Mining Portal & Stratum Proxy (Connects miners on port 3032)
  chta_pool:
    image: shorelinecrypto/nomp-neng:latest
    container_name: chta_pool
    restart: unless-stopped
    ports:
      - "3032:3032"
    depends_on:
      - chta_node
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DIR=$$(dirname $$(find / -name config_example.json 2>/dev/null | head -n 1))
        cd $$DIR
        mkdir -p config/pool_configs
        cp config_example.json config/config.json
        sed -i 's/127.0.0.1/redis/g' config/config.json
        cat << 'EOF' > config/pool_configs/cheetahcoin.json
        {
          "enabled": true,
          "coin": "cheetahcoin.json",
          "address": "CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL",
          "rewardRecipients": {
            "CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL": 1.0
          },
          "paymentProcessing": {
            "enabled": true,
            "paymentInterval": 600,
            "minimumPayment": 5,
            "daemon": {
              "host": "chta_node",
              "port": 4743,
              "user": "5tratum_user",
              "password": "5tratum_secure_pass"
            }
          },
          "ports": {
            "3032": {
              "diff": 0.001,
              "varDiff": {
                "minDiff": 0.0005,
                "maxDiff": 100,
                "targetTime": 15,
                "retargetTime": 60,
                "variancePercent": 30
              }
            }
          },
          "daemons": [
            {
              "host": "chta_node",
              "port": 4743,
              "user": "5tratum_user",
              "password": "5tratum_secure_pass"
            }
          ]
        }
        EOF
        while true; do
          node init.js
          echo "Waiting for chta_node to finish syncing..."
          sleep 15
        done

volumes:
  chta_data:
