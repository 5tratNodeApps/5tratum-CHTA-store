version: '3.7'

services:
  # Container 1: Redis Database
  redis:
    image: redis:alpine
    container_name: chta_redis
    restart: unless-stopped

  # Container 2: Cheetahcoin v2.5.0 Core Daemon
  chta_node:
    image: ubuntu:22.04
    container_name: chta_node
    restart: unless-stopped
    volumes:
      - chta_data:/root/.cheetahcoin
    entrypoint: ["/bin/bash", "-c"]
    command: ["apt-get update && apt-get install -y wget tar ca-certificates && mkdir -p /opt/chta /root/.cheetahcoin && if [ ! -f /opt/chta/cheetahcoind ]; then wget -O /tmp/chta.tgz https://github.com && tar -xzf /tmp/chta.tgz -C /opt/chta --strip-components=1 && rm /tmp/chta.tgz; fi && /opt/chta/cheetahcoind -datadir=/root/.cheetahcoin -server=1 -rpcuser=5tratum_user -rpcpassword=5tratum_secure_pass -rpcallowip=0.0.0.0/0 -rpcport=4743 -listen=1 -printtoconsole"]

  # Container 3: NOMP Mining Portal & Stratum Proxy (5 CHTA min / 10-min payout)
  chta_pool:
    image: shorelinecrypto/nomp-neng:latest
    container_name: chta_pool
    restart: unless-stopped
    ports:
      - "3032:3032"
    depends_on:
      - chta_node
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /root/NOMP-neng/config/pool_configs && cp /root/NOMP-neng/config_example.json /root/NOMP-neng/config/config.json && sed -i 's/127.0.0.1/redis/g' /root/NOMP-neng/config/config.json && echo '{\"enabled\":true,\"coin\":\"cheetahcoin.json\",\"address\":\"CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL\",\"rewardRecipients\":{\"CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL\":1.0},\"paymentProcessing\":{\"enabled\":true,\"paymentInterval\":600,\"minimumPayment\":5,\"daemon\":{\"host\":\"chta_node\",\"port\":4743,\"user\":\"5tratum_user\",\"password\":\"5tratum_secure_pass\"}},\"ports\":{\"3032\":{\"diff\":0.001,\"varDiff\":{\"minDiff\":0.0005,\"maxDiff\":100,\"targetTime\":15,\"retargetTime\":60,\"variancePercent\":30}}},\"daemons\":[{\"host\":\"chta_node\",\"port\":4743,\"user\":\"5tratum_user\",\"password\":\"5tratum_secure_pass\"}]}' > /root/NOMP-neng/config/pool_configs/cheetahcoin.json && cd /root/NOMP-neng && node init.js"]

  # Container 4: Working Orange-Border Console + Live Sync Percentage & ETA
  chta_admin_interface:
    image: node:18-alpine
    container_name: chta_admin_interface
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - chta_node
    entrypoint: ["/bin/sh", "-c"]
    command: ["node -e 'const http=require(`http`);let lb=0,lt=Date.now(),eta=`Calculating...`;function rpc(m){return new Promise(r=>{const d=JSON.stringify({jsonrpc:`1.0`,id:`1`,method:m,params:[]});const q=http.request({hostname:`chta_node`,port:4743,method:`POST`,auth:`5tratum_user:5tratum_secure_pass`,headers:{[`Content-Type`]:`application/json`,[`Content-Length`]:d.length}},s=>{let b=``;s.on(`data`,c=>b+=c);s.on(`end`,()=>{try{r(JSON.parse(b).result)}catch(e){r(null)}})});q.on(`error`,()=>r(null));q.write(d);q.end()})}http.createServer(async(req,res)=>{const i=await rpc(`getblockchaininfo`),n=await rpc(`getnetworkinfo`);let p=0,b=0,h=0,c=n?n.connections:0,st=`Starting Cheetahcoin Daemon...`;if(i){b=i.blocks||0;h=i.headers||0;p=h>0?Math.min(100,(b/h)*100).toFixed(2):0;const now=Date.now();if(lb>0&&b>lb){const rt=(b-lb)/((now-lt)/1000),rm=h-b;if(rm<=0)eta=`Synced (Ready)`;else if(rt>0){const s=Math.round(rm/rt);eta=s>3600?Math.floor(s/3600)+`h `+Math.floor((s%3600)/60)+`m`:Math.floor(s/60)+`m `+(s%60)+`s`}}lb=b;lt=now;st=p>=99.9?`Fully Synced & Ready`:`Synchronizing Blockchain...`}res.writeHead(200,{[`Content-Type`]:`text/html`});res.end(`<html><head><meta http-equiv=\"refresh\" content=\"5\"></head><body style=\"background:#111;color:#fff;font-family:sans-serif;padding:8%;text-align:center\"><h2>Cheetahcoin Node Administration Console</h2><div style=\"max-width:600px;margin:20px auto;background:#222;padding:20px;border-radius:8px;border:1px solid #ff9900\"><strong>Status:</strong> ${st}<div style=\"background:#333;border-radius:5px;height:20px;overflow:hidden;margin:15px 0\"><div style=\"background:#ff9900;height:100%;width:${p}%\"></div></div><div style=\"font-size:20px;color:#ff9900;font-weight:bold\">${p}%</div><p>Blocks: <strong>${b.toLocaleString()}</strong> / ${h.toLocaleString()} | Peers: <strong>${c}</strong></p><p>Est. Time Remaining: <strong>${eta}</strong></p></div><p>Point your miners to <strong>192.168.68.74:3032</strong> (Worker: <strong>CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL.worker1</strong>)</p></body></html>`)}).listen(8080)'"]

volumes:
  chta_data:
