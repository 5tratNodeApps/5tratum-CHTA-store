version: '3.7'

services:
  # Container 1: Redis Database
  redis:
    image: redis:alpine
    container_name: chta_redis
    restart: unless-stopped

  # Container 2: Cheetahcoin v2.5.0 Core Daemon
  chta_node:
    image: ubuntu:22.04
    container_name: chta_node
    restart: unless-stopped
    volumes:
      - chta_data:/root/.cheetahcoin
    entrypoint: ["/bin/bash", "-c"]
    command: ["apt-get update && apt-get install -y wget tar ca-certificates && mkdir -p /opt/chta /root/.cheetahcoin && if [ ! -f /opt/chta/cheetahcoind ]; then wget -O /tmp/chta.tgz https://github.com && tar -xzf /tmp/chta.tgz -C /opt/chta --strip-components=1 && rm /tmp/chta.tgz; fi && /opt/chta/cheetahcoind -datadir=/root/.cheetahcoin -server=1 -rpcuser=5tratum_user -rpcpassword=5tratum_secure_pass -rpcallowip=0.0.0.0/0 -rpcport=4743 -listen=1 -printtoconsole"]

  # Container 3: NOMP Mining Portal & Stratum Proxy (Auto-Path + Wait Loop)
  chta_pool:
    image: shorelinecrypto/nomp-neng:latest
    container_name: chta_pool
    restart: unless-stopped
    ports:
      - "3032:3032"
    depends_on:
      - chta_node
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command: ["DIR=$(dirname $(find / -name config_example.json 2>/dev/null | head -n 1)); cd $DIR && mkdir -p config/pool_configs && cp config_example.json config/config.json && sed -i 's/127.0.0.1/redis/g' config/config.json && echo '{\"enabled\":true,\"coin\":\"cheetahcoin.json\",\"address\":\"CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL\",\"rewardRecipients\":{\"CKTN9HLokShTFRzjNXsDYA7EBcDinBMNkL\":1.0},\"paymentProcessing\":{\"enabled\":true,\"paymentInterval\":600,\"minimumPayment\":5,\"daemon\":{\"host\":\"chta_node\",\"port\":4743,\"user\":\"5tratum_user\",\"password\":\"5tratum_secure_pass\"}},\"ports\":{\"3032\":{\"diff\":0.001,\"varDiff\":{\"minDiff\":0.0005,\"maxDiff\":100,\"targetTime\":15,\"retargetTime\":60,\"variancePercent\":30}}},\"daemons\":[{\"host\":\"chta_node\",\"port\":4743,\"user\":\"5tratum_user\",\"password\":\"5tratum_secure_pass\"}]}' > config/pool_configs/cheetahcoin.json && while true; do node init.js; echo 'Waiting for chta_node to finish syncing...'; sleep 15; done"]

  # Container 4: Clean Nginx Web Console (Uses curl instead of wget)
  chta_admin_interface:
    image: nginx:alpine
    container_name: chta_admin_interface
    restart: unless-stopped
    ports:
      - "8080:80"
    entrypoint: ["/bin/sh", "-c"]
    command: ["HOST=raw.githubusercontent.com && PATH=/5tratNodeApps/5tratum-CHTA-store/main/5tratnodeapps-cheetahcoin/index.html && curl -sSL https://$HOST$PATH -o /usr/share/nginx/html/index.html; nginx -g 'daemon off;'"]

volumes:
  chta_data:
